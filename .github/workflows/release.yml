name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: |
          mkdir -p out/SteamLED
          cp -r dist py_modules main.py plugin.json out/SteamLED/
          cd out && zip -r SteamLED.zip SteamLED/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/SteamLED.zip
          generate_release_notes: true
          name: "SteamLED ${{ github.ref_name }}"
